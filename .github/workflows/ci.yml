name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t github-review-agent .
      - name: Smoke test API starts
        run: |
          docker run -d --name api -p 8000:8000 -e GITHUB_WEBHOOK_SECRET=ci github-review-agent
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs) && [ "$code" = "200" ] && exit 0
            sleep 1
          done
          docker logs api; exit 1
